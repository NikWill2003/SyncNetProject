defaults:
  - coalitions_base
  - _self_

name: coalitions
seed: 1
root: ./data
dir: coalitions_${dataset.family}   # keyed by family so each arm prepares/loads its own data

# task shape
n_modules: 4            # 2 | 4 | 6 (catalogues defined in datasets/coalitions/graphs.py)
K: 4                    # small alphabet: integer-sum readout stays learnable
family: all             # clusterable | nonclique | frustrated | all
increments: [1, 2, 3]
stream_mode: iid        # iid = neighbour tokens unpredictable -> live routing required

# sizes / lengths
train_size: 20000
test_size: 2000
T_train: 32
T_test: 32              # raise above T_train for length-generalisation test split

# episode schedule
episodes_min: 1
episodes_max: 3
window_min: 4
window_max: 8
post_steps: 2

# command channel & readout
command_mode: sparse    # sparse | dense
readout_mode: instant   # instant | latch
readout_lag_max: 3

# rho ladder dims cached into the npz (calibration axis)
rho_dims: [2, 3, 4]
