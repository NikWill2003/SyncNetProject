
# @package _global_
# GO/NO-GO readout check with perfect routing.
#
#   python prepare_dataset.py task=coalitions dataset.family=frustrated
#   python main.py task=coalitions experiment=coalitions/oracle_check \
#       dataset.family=frustrated
defaults:
  - override /dataset: coalitions/default
  - override /model: coalitions/oracle

dataset:
  n_modules: 4
  family: frustrated

train:
  n_steps: 4000
  train_bs: 256
  val_bs: 1024
  early_stop_metric: acc_joint
  early_stop_big_is_better: true

logging:
  eval_log_interval: 200
  train_log_interval: 200
  info_metrics: [loss, accuracy, acc_joint, acc_indep]

wandb:
  project_name: coalitions
  tags: [oracle_check, n4]
