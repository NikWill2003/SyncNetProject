
# @package _global_
# Unattended comparison run with synchrony callbacks and best checkpoints.
defaults:
  - override /callbacks: sort_of_clevr/sync

train:
  n_steps: 20000
  early_stop_patience: 12

logging:
  eval_log_interval: 500
  train_log_interval: 100
  save_best: true
  info_metrics: [loss, accuracy, scramble_drop, order_param]

wandb:
  enabled: true
  entity: niks_priv
  group: three_day_v1v2v3
  tags: [three_day, variants]
