# @package _global_
# The syncnet half of the transformer conditioning result: where the
# question enters x how the image is tokenised. Run this FIRST -- it sets
# q_conditioning for the three sweeps below.
#
# NOTE the arms are not exactly width-matched: with encoder.ch=96 and
# q_emb_dim=32, broadcast_cat tokens are 128-wide while film/token are
# 96. Raise ch to 128 if you would rather match the visual width and
# accept broadcast_cat being wider overall.
defaults:
  - override /model: sort_of_clevr/syncnet

model:
  encoder:
    ch: 96
  q_emb_dim: 32
  partition: none
  gate_mode: phase
  readout_mode: concat
  n_modules: 4
  module_dim: 128
  T: 6

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.q_conditioning: film,broadcast_cat,token
      model.encoder.patch_size: 5,15
      train.seed: 0,1