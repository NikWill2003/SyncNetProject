# @package _global_

defaults:
  - override /model: sort_of_clevr/transformer

model:
  patch_emb_dim: 96
  hidden_dim: 128
  n_heads: 4
  n_layers: 4
  ffn_mult: 4
  dropout: 0.0
  pos_enc: learnt_2d
  share_layer_weights: false

train:
  n_steps: 100000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1000000 # no early stopping
  mixed_precision: bf16
  loader_mode: gpu_cached
  compile_model: true
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.q_conditioning: token,broadcast_cat,film
      model.patch_size: 5,15
      train.seed: 0,1,2