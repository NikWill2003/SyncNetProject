# @package _global_

defaults:
  - override /model: sort_of_clevr/question_only

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached

optim:
  lr: 3e-4
  weight_decay: 0.0
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: false

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.hidden_dim: 128,256
      train.seed: 0,1,2,3,4