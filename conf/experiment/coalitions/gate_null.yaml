# @package _global_
# THE COALITIONS GATE COMPARISON, 5 SEEDS -- 35 runs, ~11.4 h.
#
# This is the experiment the thesis needs. Sort-of-CLEVR and SQOOP are both
# static with uniform or systematic relevance; coalitions is the only task
# with TEMPORAL, SPARSE relevance, and therefore the only one that can support
# the topology-change claim POSITIVELY rather than producing a third null.
#
# Seven gates from one config -- CoalitionsConfig carries every gate's knobs,
# so `model.gate` is a clean single-axis sweep with the backbone held fixed
# and `message_proj: shared` making the gate the sole routing bottleneck.
#
#   no_comm     diagnostic floor: messages off entirely
#   always_on   diagnostic ceiling for "communication without routing"
#   oracle      ground-truth adjacency: the routing upper bound
#   mlp         learned pairwise gate, no shared state
#   recurrent   learned gate with a controller
#   attention   the "why not just attention?" steelman (O(M^2) dof)
#   phase       the thesis mechanism (M-1 dof coalition manifold)
#
# THE CLAIM UNDER TEST is not "phase wins". It is that phase reaches the
# oracle's routing quality with M-1 degrees of freedom where attention needs
# O(M^2), and that phase degrades on FRUSTRATED graphs in a way attention does
# not. Read the per-graph metrics, not just the mean.
#
# ALWAYS REPORT AGAINST THE FLOORS:
#     constant 0.233 | copy-own-token 0.757 | NO-COMM ORACLE 0.786
# A model at or below 0.786 has not demonstrated communication.
#
# COST (measured, min per 100k steps): no_comm 14.9, oracle 14.6,
# always_on 14.5, recurrent 17.3, mlp 19.8, phase 21.8, attention 28.6.
defaults:
  - override /model: coalitions/phase

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 1_000
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.gate: no_comm,always_on,oracle,mlp,recurrent,attention,phase
      train.seed: 0,1,2,3,4
