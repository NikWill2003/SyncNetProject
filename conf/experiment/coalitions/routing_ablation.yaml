# @package _global_
# IS THE GATE ACTUALLY THE BOTTLENECK? -- 12 runs, ~4.2 h.
#
# The whole coalitions design rests on `message_proj: shared` making the gate
# the SOLE place routing can happen. If a per-pair message projection recovers
# the same accuracy with the gate held fixed, then the gate was never the
# bottleneck and every gate comparison above is measuring something else --
# exactly the failure mode that produced the Sort-of-CLEVR null, where the
# readout's covert cross-module integration channel had to be removed
# (readout_mode='sum') before the comparison meant anything.
#
# Run this BEFORE writing up any coalitions gate result. It is the control
# that makes the rest interpretable, and at 4 hours it is cheap insurance.
#
#   shared vs per_pair differ a lot  -> the gate is the bottleneck, proceed
#   they are within noise            -> the gate is not load-bearing; say so,
#                                       and the coalitions chapter becomes a
#                                       third null rather than a positive
#
# phase_kuramoto is included as the dynamics control: if the mechanism matters
# it should matter more under a real Kuramoto update than under a learned MLP
# update. (29.5 min/100k, the most expensive gate in the suite.)
defaults:
  - override /model: coalitions/phase

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 1_000
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.gate: phase,attention
      model.message_proj: shared,per_pair
      train.seed: 0,1,2
