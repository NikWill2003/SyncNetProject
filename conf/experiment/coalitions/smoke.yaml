# @package _global_
# SMOKE TEST -- 7 runs x 2,000 steps, ~15 min total. RUN THIS FIRST.
#
# Nothing has ever run on coalitions. The task was blocked by a signature
# mismatch (CoalitionsBase.forward took (streams, commands, ...) while the
# Trainer calls model(batch)), fixed by adding forward(batch) delegating to
# forward_seq with callbacks/metrics.py pointed at forward_seq. That fix has
# been validated in a notebook, not in the trainer.
#
# 15 minutes here buys the difference between "a 2-day batch produced results"
# and "a 2-day batch produced 40 identical stack traces at 03:00".
#
# WHAT TO CHECK BEFORE LAUNCHING THE REAL BATCH
#   * every one of the 7 gates completes 2,000 steps and writes to wandb
#   * train_loss/cross_entropy is finite and moving
#   * the callback metrics appear: acc_joint, gate_auc, offpair_leak
#   * the oracle gate is ABOVE the mlp/attention gates already at 2k
#   * no_comm sits at or below the no-comm oracle floor of 0.786
#
# FLOORS -- overall accuracy is dominated by free steps, so ALWAYS report
# against these and never raw:
#     constant            0.233
#     copy-own-token      0.757   (1.000 on INDEP, 0.143 on JOINT)
#     NO-COMM ORACLE      0.786   <- the gate. At or below this, a model has
#                                    not demonstrated communication at all.
#     61% of steps are a free copy in iid mode.
defaults:
  - override /model: coalitions/phase

train:
  n_steps: 2_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.0
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 200

logging:
  eval_log_interval: 500
  train_log_interval: 200
  save_best: false

wandb:
  tags: [smoke]

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.gate: no_comm,always_on,oracle,mlp,recurrent,attention,phase
      train.seed: 0
