# @package _global_
# N=6 FRUSTRATION LADDER -- 18 runs, ~9.7 h (N=6 costs ~1.6x N=4 runtime).
#
# N=4 has exactly ONE frustrated graph (STAR_A), so the topology-change
# prediction rests on a single point and cannot be plotted as a trend.
# N=6 has FIVE (STAR3, STAR4, STAR5, BIPARTITE_2_3, BIPARTITE_3_3) and gives
# a GRADED ladder -- which turns "one graph behaved oddly" into a
# dose-response curve, and a dose-response curve is what makes the
# topology-change claim the strongest of the three rather than the vaguest.
#
# Requires the N=6 dataset (dataset=coalitions/n6, ~1.6x the build). Build it
# ONCE on one card before either card starts training: build_dataloaders is
# not concurrency-safe and two cold jobs on the same dir each build their own
# copy.
#
# Gates trimmed to the six that carry information at this cost:
#   no_comm / oracle    the floor and the routing ceiling, per graph
#   phase               osc_dim=2, expected to fail on the frustrated five
#   attention           O(M^2) dof, expected NOT to fail on them
#   mlp                 learned pairwise control
#   always_on           communication without routing
#
# The comparison that matters is the INTERACTION: (phase - attention) as a
# function of rho(d=2) across graphs. A flat interaction is a null; a slope
# is the result.
defaults:
  - override /dataset: coalitions/n6
  - override /model: coalitions/phase

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 1_000
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.gate: no_comm,oracle,always_on,mlp,attention,phase
      train.seed: 0,1,2
