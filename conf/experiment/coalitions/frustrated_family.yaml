# @package _global_
# THE FRUSTRATED GRAPHS, UNDILUTED -- 24 runs + 1 build, ~8 h.
#
# family=all mixes the frustrated graphs in with the clusterable ones, so
# the overall accuracy of every arm is dominated by graphs where a scalar
# phase gate has no difficulty at all. The topology-change prediction lives
# entirely in the frustrated subset, and training ONLY on that subset asks
# the sharpest version of the question: given a training distribution made
# of the cases the mechanism is supposed to fail on, does osc_dim=2 fail?
#
# Two reasons to run it as well as, not instead of, the per-graph split of
# gate_null and osc_dim:
#   1. per-graph metrics on family=all are computed on whatever share of
#      the batch happened to be that graph -- noisy, and the frustrated
#      share is small;
#   2. the model can only allocate capacity to frustration if it sees it,
#      so family=all may be measuring "did not bother" rather than
#      "cannot".
#
# family is a DATA field, so this builds its own dataset.
defaults:
  - override /model: coalitions/phase

dataset:
  family: frustrated

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 1_000
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.gate: oracle,attention,phase
      model.osc_dim: 2,3
      train.seed: 0,1,2,3
