# @package _global_
# HOW THE COALITION IS ANNOUNCED AND WHEN IT IS READ -- 24 runs + 3 builds,
# ~8 h.
#
# Two data axes that decide how much of the task is routing and how much is
# memory:
#   command_mode  sparse = the coalition is announced once and must be HELD;
#                 dense  = it is re-announced every step, so nothing has to
#                 be remembered and the gate can be recomputed from the
#                 current input alone.
#   readout_mode  instant = answer while the coalition is live;
#                 latch   = answer up to readout_lag_max steps later, so the
#                 binding must survive after the command has gone.
#
# sparse+latch is the condition the thesis is really about -- a coalition
# that persists without being continuously re-specified is exactly the
# "partial commitment" story, and a phase gate has persistent state (its
# oscillators) where an attention gate recomputes from scratch each step.
# If phase has an advantage anywhere, this is the most likely place, and it
# is currently untested.
#
# All four cells are separate datasets; the dir template encodes both
# fields, so each builds once on first use.
defaults:
  - override /model: coalitions/phase

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 1_000
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      dataset.command_mode: sparse,dense
      dataset.readout_mode: instant,latch
      model.gate: attention,phase
      train.seed: 0,1,2
