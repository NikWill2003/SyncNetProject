
# @package _global_
# Graded rho ladder (N=6).
#
#   python prepare_dataset.py task=coalitions dataset=coalitions/n6 dataset.family=all
#   python main.py -m task=coalitions experiment=coalitions/ladder \
#       model.osc_dim=2,3,4,6 train.seed=0,1,2
defaults:
  - override /dataset: coalitions/n6
  - override /model: coalitions/phase

dataset:
  n_modules: 6
  family: all

train:
  n_steps: 8000
  train_bs: 256
  val_bs: 1024
  early_stop_metric: accuracy
  early_stop_big_is_better: true

logging:
  eval_log_interval: 400
  train_log_interval: 400
  info_metrics: [loss, accuracy, acc_joint, gate_auc, offpair_leak, rho_err_corr]

wandb:
  project_name: coalitions
  tags: [ladder, n6]
