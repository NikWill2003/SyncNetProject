# @package _global_
# THE DOSE-RESPONSE VERSION OF THE TOPOLOGY-CHANGE CLAIM -- 12 runs, ~7 h.
#
# N=6 gives five frustrated graphs with different rho(d=2), and the rho ladder
# is cached in the npz at dims [2, 3, 4, 6]. So this sweep asks the sharpest
# form of the question the thesis is about:
#
#     does the oscillator dimension at which a graph becomes learnable track
#     the dimension at which its frustration rho collapses?
#
# If yes, the claim stops being "synchrony is a nice picture" and becomes a
# quantitative prediction that was made in advance and held. That is the
# strongest possible outcome for the topology-change claim, and it is the only
# place in the project where such an outcome is still available.
#
# Read per-graph, plot accuracy(graph, osc_dim) against rho(graph, osc_dim).
# The expected signature is a staircase, not a slope: each graph should jump
# when osc_dim passes ITS frustration threshold.
defaults:
  - override /dataset: coalitions/n6
  - override /model: coalitions/phase

model:
  gate: phase
  phase_update: mlp
  message_proj: shared

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 1_000
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.osc_dim: 2,3,4,6
      train.seed: 0,1,2
