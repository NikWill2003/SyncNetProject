# @package _global_
# PHASE DYNAMICS -- 18 runs, ~6.5 h. The coalitions version of the
# Sort-of-CLEVR dynamics sweep, and it exists to attack our own claim.
#
# On Sort-of-CLEVR, omega_init 0.5 -> 10 swung phase_R from 0.97 to 0.55
# while accuracy moved 0.844 -> 0.852: the oscillators demonstrably
# synchronised, the degree of synchrony demonstrably varied, and the task
# did not care. That is the single most damaging result in the project and
# it has to be checked HERE, on the task where synchrony is supposed to be
# load-bearing, before any positive coalitions result is believed.
#
# dt sets how far the phases move per step; alpha_init sets how sharply the
# gate saturates (large alpha = hard 0/1 routing, small = soft mixing);
# kappa_max caps the coupling. If accuracy is flat across all of them while
# the reported synchrony statistics swing, the mechanism is decorative here
# too and the coalitions chapter joins the other two as a null.
#
# READ: accuracy vs the gate statistics (gate_auc, gate_sep, offpair_leak),
# as deltas above the 0.786 no-comm oracle. A flat accuracy row with a
# moving gate row is the null; a correlated pair is the result.
defaults:
  - override /model: coalitions/phase

model:
  gate: phase
  osc_dim: 2

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 1_000
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.dt: 0.1,0.25,0.5
      model.alpha_init: 2.0,4.0,8.0
      train.seed: 0,1
