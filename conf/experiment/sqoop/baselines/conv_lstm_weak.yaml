# @package _global_
# THE PUBLISHED FLOOR, RECOVERED -- 18 runs, ~2.6 h.
#
# Our conv_lstm is NOT a port of Bahdanau et al.'s Conv+LSTM. Theirs is
# spatially weak and its error stays above 14% at every #rhs; ours reaches
# 0.41% error at rhs=18 because it keeps a learned absolute position embedding
# and a FLATTEN readout. Calling it "the no-routing floor" in the write-up is
# therefore wrong, and a 0.999 baseline makes every syncnet number look bad
# against a bar that is not the published one.
#
# This sweep runs the two ablations that should recover something like the
# published floor, so the chapter can report BOTH bars:
#     strong  (ours, flatten + pos_emb)   -- an honest upper baseline
#     weak    (pool and/or no pos_emb)    -- the Bahdanau-shaped floor
#
# readout=pool is expected to sit at exactly 0.500 with train CE ln2, and that
# is CORRECT rather than broken: mean-pooling destroys absolute position and
# left_of is a pure position predicate. Report it as the proof that the task
# is position-bound, not as a failed run.
defaults:
  - override /model: sqoop/conv_lstm

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 1_000
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      dataset.rhs_variety: 1,8,18
      model.use_pos_emb: true,false
      model.readout: pool
      train.seed: 0,1,2
