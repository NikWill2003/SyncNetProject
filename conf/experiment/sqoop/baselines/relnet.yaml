# @package _global_
# Relation Network (Santoro et al. 2017); Bahdanau et al. 2019 report it
# on SQOOP and note it did not train there. A flat run at ln2 = 0.69315
# is therefore consistent with the literature rather than a bug -- but
# check train_loss/cross_entropy before concluding either way.
#
# Conditioning is intrinsic, so no q_conditioning axis.

defaults:
  - override /model: sqoop/relnet

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.0
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

# 1 seed: a screen, not a measurement. READ train_loss/cross_entropy
# BEFORE ACCURACY.
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      train.seed: 0
