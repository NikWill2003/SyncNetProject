# @package _global_
# WHAT MAKES OUR CONV+LSTM SO STRONG? -- 4 runs, ~35 min, rhs=18.
#
# Ours reached 0.41% error at rhs=18. Bahdanau et al.'s Conv+LSTM sits off
# the top of a 14% error axis at EVERY #rhs. The difference is two readout
# choices in our port that are not in theirs, both of which hand the model
# absolute position -- and left_of/right_of/above/below are pure position
# predicates:
#
#   use_pos_emb  a learned (1, ch, H, W) parameter added to the conv
#                features. A CNN is translation-equivariant, so without it
#                the model cannot represent WHERE anything is.
#   readout      flatten keeps every spatial cell separately; pool (mean
#                over H,W) discards position, which is what a weak
#                baseline is supposed to do.
#
# This matters beyond tidiness: the syncnet is currently being compared
# against a baseline with a spatial shortcut that the quadrant partition
# is meant to be the *interesting* way of supplying. Until this runs, the
# "floor" in every SQOOP comparison is mislabelled.
#
# Expect the (false, pool) cell near the published error rate. If it is,
# report BOTH: the gap between it and (true, flatten) measures how much of
# SQOOP is solved by absolute position alone, which is worth a paragraph
# on its own. If (false, pool) is also near zero error, then our port is
# easier than theirs somewhere else and that needs finding before any
# SQOOP number goes in the thesis.
defaults:
  - override /model: sqoop/conv_lstm

model:
  emb_dim: 32
  lstm_hidden: 128
  hidden_dim: 256
  encoder:
    ch: 128

dataset:
  rhs_variety: 18

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.use_pos_emb: true,false
      model.readout: flatten,pool
      train.seed: 0
