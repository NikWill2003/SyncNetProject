# @package _global_
# The same q_pool x fusion grid as the Sort-of-CLEVR cnn_mlp sweep,
# same class, opposite default corner. Running both makes the two
# tasks' conv baselines comparable.

defaults:
  - override /model: sqoop/conv_lstm

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.0
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.q_pool: mlp,lstm
      model.fusion: readout,spatial
      train.seed: 0,1,2
