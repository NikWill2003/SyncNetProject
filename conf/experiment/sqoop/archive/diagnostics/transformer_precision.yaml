# @package _global_
# THE MISSING fp32 CELLS (hypothesis H4) -- 4 runs, ~1 h.
#
# Every transformer run in the result set is bf16; the fp32 arms of
# diagnostics/transformer_lr never executed (4 of 8 cells present). Precision
# has therefore never been tested in isolation on this task.
#
# Prior is LOW: iid_control at rhs=35 was also bf16 and it escaped ln2, so
# bf16 is not fatal per se. What is untested is the INTERACTION -- bf16 with a
# token stream that is ~90% constant question and ~10% image, where attention
# logits are a large constant plus a ~2% patch-dependent term. That is the most
# cancellation-prone arithmetic in the project.
#
# Cheap enough to run as a rider rather than as a night. If fp32 escapes and
# bf16 does not, every bf16 number in the SQOOP chapter needs re-checking.
defaults:
  - override /model: sqoop/transformer

model:
  q_encoder:
    name: tokenise
    embedding_dim: 32
  q_conditioning: broadcast_cat
  encoder:
    ch: 96
    patch_size: 8
  hidden_dim: 128
  n_heads: 4
  n_layers: 4
  ffn_mult: 4
  dropout: 0.0

dataset:
  rhs_variety: 18

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: 'no'        # <- THE POINT OF THIS FILE
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  weight_decay: 0.0
  lr_scheduler: warmup_cosine

logging:
  eval_log_interval: 1_000
  train_log_interval: 250
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      optim.lr: 3e-4,1e-3
      optim.lr_scheduler_params.warmup_steps: 2000,10000
      train.seed: 0
