# @package _global_
# FiLM. The external calibration point SQOOP currently lacks:
# Bahdanau et al. report per pair-variety error rates for it.

defaults:
  - override /model: sqoop/film

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.0
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.n_blocks: 2,4,6
      train.seed: 0,1,2
