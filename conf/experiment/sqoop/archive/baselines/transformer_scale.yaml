# @package _global_
# SQOOP TRANSFORMER CAPACITY -- 6 runs, ~3.4 h, rhs=18.
#
# The transformer sits at exactly ln2 with train accuracy 0.50 at every
# rhs from 1 to 18 -- it does not fit even the training set. But it is not
# broken: it overfits 512 examples to 0.042 in 1000 steps, and at rhs=35
# (IID, nothing held out) it reaches 0.673. So something about these
# datasets traps a 0.58M model in the chance basin.
#
# Capacity is the untested explanation. If a 9.7M transformer also stays
# at ln2, size is not it and the arm should be reported as failing to
# optimise on SQOOP rather than debugged further -- the conv_lstm already
# establishes the task is solvable.
defaults:
  - override /model: sqoop/transformer

model:
  q_conditioning: broadcast_cat
  encoder:
    patch_size: 8
    ch: 96
  n_heads: 4
  ffn_mult: 4
  dropout: 0.0
  q_encoder:
    name: tokenise
    embedding_dim: 32

dataset:
  rhs_variety: 18

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.hidden_dim: 128,256,384
      model.n_layers: 4,8
      train.seed: 0
