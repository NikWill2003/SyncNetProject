# @package _global_
# IID CONTROL, CORRECTED -- 1 run, ~15 min.
#
# The first iid_control was model-agnostic, so the syncnet ran at its
# DEFAULT config, which is partition=none. That scored 0.513 at rhs=35 --
# and partition=none scored 0.556 at rhs=18, so the cell was measuring the
# weak arm, not the syncnet's ceiling. My error; this pins quadrant.
#
# What it answers: with nothing held out at all, how well can the syncnet
# do SQOOP? Everything on the rhs curve is a delta from this number, and
# without it a low curve cannot be split between "cannot do the relation"
# and "cannot generalise across pairs".
defaults:
  - override /model: sqoop/syncnet

model:
  q_conditioning: film
  partition: quadrant
  gate_mode: phase
  readout_mode: sum
  n_modules: 4
  module_dim: 128
  T: 6

dataset:
  rhs_variety: 35

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      train.seed: 0
