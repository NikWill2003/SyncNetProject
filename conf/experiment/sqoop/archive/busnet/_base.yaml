# @package _global_
# THE FIELD-BUS SYNCNET ON SQOOP -- base recipe, matched to rhs_seeded:
# 100k steps, 1.08M train examples, bf16, gpu_cached. Pass dataset.rhs_variety
# and train.seed. M=6 slots for 5 letters (one spare for the binding lottery).
defaults:
  - override /model: sqoop/busnet

model:
  n_modules: 6

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01            # parity with every other sqoop recipe (frozen protocol)
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500

wandb:
  tags: [sqoop_busnet]

hydra:
  mode: MULTIRUN
