# @package _global_
# SQOOP SYNCNET CAPACITY -- 12 runs, ~7.6 h, at rhs=4 and rhs=18.
#
# The rhs curve is unambiguous: conv_lstm beats the syncnet at EVERY rhs
# (0.709/0.925/0.956/0.999/0.993 vs 0.596/0.677/0.779/0.823/0.846), with
# no crossover anywhere. Before that goes in the thesis as an
# architectural result it has to survive the obvious objection, which is
# that the syncnet was simply smaller -- 0.39M against the conv_lstm's
# 0.89M.
#
# Two rhs values, not five: 18 is where the syncnet is strongest and 4 is
# where the gap is widest, so between them they bound the answer. If 3.2M
# parameters does not close it at either, size is not the explanation.
defaults:
  - override /model: sqoop/syncnet

model:
  q_conditioning: film
  partition: quadrant
  gate_mode: phase
  readout_mode: sum
  n_modules: 4
  T: 6

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.module_dim: 128,256,512,768
      dataset.rhs_variety: 4,18
      train.seed: 0
