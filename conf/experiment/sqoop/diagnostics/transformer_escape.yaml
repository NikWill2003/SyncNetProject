# @package _global_
# ESCAPE-TIME DIAGNOSTIC (hypothesis H1) -- 6 runs, ~4.5 h.
#
# THE HYPOTHESIS
#   SQOOP has an EXACTLY FLAT chance plateau. Generator deviation 8 balances
#   labels within every (pair, rel) cell by construction, so the question-only
#   Bayes optimum is exactly 0.5000 and a question-only model has ZERO
#   gradient, not a small one. Every model starts on that plateau -- measured
#   locally, conv_lstm is still at 0.6932 at 1,500 steps and the syncnet at
#   0.6936 at 3,500 steps on the same data they later solve. Leaving it
#   requires the image pathway to break the symmetry.
#
#   conv_lstm and the syncnet leave early because their readouts hand them a
#   first-order signal (position-indexed flatten; normalised content-addressed
#   attention with a question-derived query and beta=5 sharpening). The
#   transformer has to discover selection through un-normalised dot-product
#   attention whose across-patch variation is ~2% of the token norm.
#
#   If its escape time exceeds ~30-40k steps, warmup_cosine has already
#   annealed the LR to nothing and escape becomes impossible -- and the runs
#   that "peak early" are then exactly the stuck ones, which is what the
#   Sort-of-CLEVR best_step distribution shows.
#
# WHAT IS UNDER TEST IS THE SCHEDULE, NOT THE LR. Every previous sweep used
# warmup_cosine. These arms hold the LR up.
#
# READ: the FIRST STEP AT WHICH train_loss/cross_entropy < 0.6900. That number
# is the whole result. If no arm crosses it by 100k, H1 is dead and the
# transformer arm should be written up as a negative.
defaults:
  - override /model: sqoop/transformer

model:
  emb_dim: 32
  q_conditioning: broadcast_cat
  patch_emb_dim: 96
  patch_size: 8
  hidden_dim: 128
  n_heads: 4
  n_layers: 4
  ffn_mult: 4
  dropout: 0.0
  pos_enc: learnt_2d
  share_layer_weights: false

dataset:
  rhs_variety: 18

train:
  n_steps: 300_000          # 3x the previous budget
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  weight_decay: 0.0         # can-it-fit test
  lr_scheduler: constant    # <- THE POINT OF THIS FILE
  lr_scheduler_params: {}

logging:
  eval_log_interval: 2_000  # 300k steps: do not spend the night evaluating
  train_log_interval: 250   # dense, so the escape step is resolvable
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      optim.lr: 3e-4,1e-3,3e-3
      train.seed: 0,1
