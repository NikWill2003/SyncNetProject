# @package _global_
# THE FROZEN PROTOCOL -- one recipe for every thesis cell, chosen for
# SyncNet and shared fairly: AdamW 3e-4, wd 0.01, warmup-cosine 2k, 100k
# uniform steps, bs 256 (val 1024), bf16, clip 1, eval 500, best-on-val.
# Families and tiers compose on top; nothing below chooses a model.
train:
  seed: 0
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

wandb:
  tags: [v16]

hydra:
  mode: MULTIRUN
