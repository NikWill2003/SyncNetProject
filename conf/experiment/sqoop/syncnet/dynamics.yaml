# @package _global_
# Where in Kuramoto parameter space do trained SQOOP models sit?
# Cluster synchronisation needs frequency dispersion; learn_omega=false
# imposes it as a buffer so training cannot erase it, which a learnable
# omega=0.5 model was observed to do on Sort-of-CLEVR (global sync by
# t=3, i.e. phase learned as a switch rather than a router).
defaults:
  - override /model: sqoop/syncnet

model:
  emb_dim: 32
  q_conditioning: film        # <- winner of conditioning.yaml
  partition: quadrant
  gate_mode: phase
  readout_mode: sum
  n_modules: 4
  T: 6
  dt: 0.1

dataset:
  rhs_variety: 18

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

# SEEDS: 1 per cell -- a shakedown budget, not a measurement. Enough to
# gauge throughput, memory and whether an arm trains at all. At the
# observed sigma=0.022 a single seed cannot rank arms or resolve the
# shape of an rhs curve; raise to 5 for screening and 15 for anything
# that goes in the thesis.

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.omega_init: 0.5,2.0,5.0,10.0
      model.learn_omega: true,false
      train.seed: 0
