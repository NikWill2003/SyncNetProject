# @package _global_
# Run FIRST of the syncnet sweeps -- it sets q_conditioning for the rest,
# exactly as on Sort-of-CLEVR.
#
# The arms are not width-matched: with encoder.ch=96 and q_emb_dim=32,
# broadcast_cat tokens are 128 wide while film/token are 96. Raise ch to
# 128 if you would rather match visual width and accept broadcast_cat
# being wider overall. Held at rhs=18 so this measures fusion, not
# generalisation.
defaults:
  - override /model: sqoop/syncnet

model:
  emb_dim: 32
  encoder:
    ch: 96
  q_emb_dim: 32
  partition: none
  gate_mode: phase
  readout_mode: concat
  n_modules: 4
  module_dim: 128
  T: 6

dataset:
  rhs_variety: 18

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

# SEEDS: 1 per cell -- a shakedown budget, not a measurement. Enough to
# gauge throughput, memory and whether an arm trains at all. At the
# observed sigma=0.022 a single seed cannot rank arms or resolve the
# shape of an rhs curve; raise to 5 for screening and 15 for anything
# that goes in the thesis.

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.q_conditioning: film,broadcast_cat,token
      model.encoder.patch_size: 4,8
      train.seed: 0
