# @package _global_
# THE SYNCNET COMPOSITIONALITY CURVE -- the SQOOP headline.
#
# Read against transformer_rhs and conv_lstm at the same rhs values and
# the same training-set size. A single rhs point says nothing; the claim
# lives in whether the syncnet curve rises earlier or stays higher at
# small rhs, which is where systematic generalisation actually bites.
#
# baselines/transformer_rhs.yaml for why this is not optional).
#
# 3 seeds is a SCREENING budget. At the observed sigma=0.022, 3 seeds
# only resolves a ~5-point gap; if the curves separate by less than that,
# rerun the separating rhs values at 15 seeds before claiming anything.
defaults:
  - override /model: sqoop/syncnet

model:
  emb_dim: 32
  q_conditioning: film        # <- winner of conditioning.yaml
  partition: quadrant         # <- winner of communication.yaml
  gate_mode: phase
  readout_mode: sum
  n_modules: 4
  module_dim: 128
  T: 6

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

# SEEDS: 1 per cell -- a shakedown budget, not a measurement. Enough to
# gauge throughput, memory and whether an arm trains at all. At the
# observed sigma=0.022 a single seed cannot rank arms or resolve the
# shape of an rhs curve; raise to 5 for screening and 15 for anything
# that goes in the thesis.

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      dataset.rhs_variety: 1,2,4,8,18
      train.seed: 0
