# @package _global_
# IdentityBusNet + spatial claim prior: a learned per-slot bias over
# cells in the competition logits, so slots start hunting in their own region
# rather than racing from symmetric noise. Competition still binds, phase still
# carries it. Registered: assembly rate up, L1 interventions intact.
defaults:
  - /experiment/sort_of_clevr/sync/hybrids/_family
  - override /model: sort_of_clevr/identity_busnet
  - _self_
model:
  claim_prior: spatial
