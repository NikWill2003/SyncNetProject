# @package _global_
# Where in Kuramoto parameter space do trained models sit? Cluster
# synchronisation needs frequency dispersion; learn_omega=false imposes
# it as a buffer so training cannot erase it (which a learnable
# omega=0.5 model was observed to do -- it globally synchronised by t=3).
defaults:
  - override /model: sort_of_clevr/syncnet

model:
  q_conditioning: film        # <- winner of conditioning.yaml
  partition: quadrant
  gate_mode: phase
  readout_mode: sum
  n_modules: 4
  T: 6
  dt: 0.1

train:
  # Matched to the SQOOP broad pass: bs 256 x 100k steps over
  # 36,000 x 3 x 10 = 1,080,000 examples = 23.7 epochs, the same figure
  # SQOOP runs at. READ train_loss/cross_entropy BEFORE ACCURACY.
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

# 1 seed, matching the SQOOP broad pass. At sigma=0.022 that ranks
# nothing; it screens which arms are worth spending seeds on. Note
# test_size=1000 scenes gives 30,000 eval questions (~3,300 per subtype),
# roughly 5x the old 200-scene split, so sigma should now be smaller than
# the 0.022 measured before -- re-estimate it from these runs before
# choosing the seed count for the focused pass.

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.omega_init: 0.5,2.0,5.0,10.0
      model.learn_omega: true,false
      train.seed: 0