# @package _global_
# SYNCNET CAPACITY LADDER at patch 5 -- 12 runs, ~4.6 h.
#
# The question the gate null leaves open: is the syncnet's ceiling
# (ternary ~0.63 against a transformer's 0.867) a matter of size?
#
# Two arms, because quadrant PINS n_modules to 4 -- module count cannot
# be swept under a spatial partition, so width is the only axis there.
# partition=none frees n_modules but removes the thing that was actually
# carrying the result (+0.082 ternary), which is why both are here: if
# width alone closes the gap under quadrant, capacity was the problem; if
# neither arm moves, it is architectural.
defaults:
  - override /model: sort_of_clevr/syncnet

model:
  q_conditioning: film
  gate_mode: phase
  readout_mode: sum
  T: 6
  encoder:
    encoder:
      patch_size: 5

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.module_dim: 128,256,512,768
      model.n_modules: 4
      model.partition: quadrant
      train.seed: 0,1,2
