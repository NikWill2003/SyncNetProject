# @package _global_
# CAPACITY control 1/3 -- 1 run. d=4 but the receiver reads only its own
# axis (rx_channels=1). If accuracy falls back to the d=2 plateau, the
# d-sweep's gain lives in the orthogonal projections, i.e. in the senders'
# small offsets from the common axis (phase as a linear address).
defaults:
  - /experiment/sort_of_clevr/sync_c/_base
  - _self_
model:
  phase_repr: vector
  osc_dim: 4
  rx_channels: 1
