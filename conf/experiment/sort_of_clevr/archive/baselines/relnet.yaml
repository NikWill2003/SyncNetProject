# @package _global_
# Relation Network (Santoro et al. 2017), the model this dataset was
# introduced with. Target: above 94% on both families where CNN+MLP
# plateaus near 63% relational. Reproducing that gap validates the
# whole pipeline. Conditioning is intrinsic (the question enters each
# pair inside g_theta), so there is no q_conditioning axis here.

defaults:
  - override /model: sort_of_clevr/relnet

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.0
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.pair_spatial: 3,5
      train.seed: 0,1,2
