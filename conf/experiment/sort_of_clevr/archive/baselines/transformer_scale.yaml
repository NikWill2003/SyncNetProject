# @package _global_
# TRANSFORMER CAPACITY LADDER at patch 5 -- 6 runs, ~13.3 h.
#
# The existing capacity sweep ran at patch 15, where ternary collapses
# from 0.867 to 0.573 -- a regime in which nothing can do the task, so it
# measured nothing. This is the same axis in the working regime.
#
# It is also the control the syncnet comparison needs. The syncnet tops
# out at ternary ~0.63 (+0.087 over the 0.545 floor) while a 0.58M
# transformer reaches 0.867. If the transformer keeps climbing with size
# and the syncnet does not, "the syncnet is under-parameterised" is dead
# as an explanation and the gap is architectural.
#
# A 10.8M transformer previously scored WORSE than a 3.3M one at late
# `token` conditioning; this repeats that test at film, where the model
# actually works. If accuracy peaks and then falls, report the peak and
# the fall -- that is a result about conditioning, not about capacity.
defaults:
  - override /model: sort_of_clevr/transformer

model:
  q_conditioning: film
  encoder:
    patch_size: 5
    ch: 96
  n_heads: 4
  ffn_mult: 4
  dropout: 0.0
  pos_enc: learnt_2d
  share_layer_weights: false

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  compile_model: true
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.hidden_dim: 128,256,384
      model.n_layers: 4,8
      train.seed: 0
