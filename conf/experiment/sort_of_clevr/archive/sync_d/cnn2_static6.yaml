# @package _global_
# PIXELS, upgraded read, d=6 static addresses.
defaults:
  - /experiment/sort_of_clevr/sync_d/_base
  - _self_
model:
  encoder: {name: cnn, ch: 128, hidden: 64}
  read_heads: 4
  read_norm: modules
  read_every_step: true
  phase_repr: vector
  osc_dim: 6
  theta_init: learned
  coupling: none
  learn_omega: false
  omega_init: 0.0
