# @package _global_
# CNN+MLP (Santoro et al. 2017) over the whole question pathway.
# q_pool x fusion: the two published conv baselines are opposite
# corners of this grid -- CNN+MLP is mlp/readout, Conv+LSTM is
# lstm/spatial -- so running the full grid on both tasks turns the
# question pathway into a measured variable rather than a confound.
# Expect mlp/readout to solve non-relational and plateau on relational;
# if it does not fail there, the task is not measuring what it should.

defaults:
  - override /model: sort_of_clevr/cnn_mlp

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.0
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.q_pool: mlp,lstm
      model.fusion: readout,spatial
      train.seed: 0,1,2
