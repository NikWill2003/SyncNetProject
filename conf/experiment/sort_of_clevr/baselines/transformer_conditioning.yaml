# @package _global_

defaults:
  - override /model: sort_of_clevr/transformer

model:
  patch_emb_dim: 96
  hidden_dim: 128
  n_heads: 4
  n_layers: 4
  ffn_mult: 4
  dropout: 0.0
  pos_enc: learnt_2d
  share_layer_weights: false

train:
  # Matched to the SQOOP broad pass: bs 256 x 100k steps over
  # 36,000 x 3 x 10 = 1,080,000 examples = 23.7 epochs, the same figure
  # SQOOP runs at. READ train_loss/cross_entropy BEFORE ACCURACY.
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

# 1 seed, matching the SQOOP broad pass. At sigma=0.022 that ranks
# nothing; it screens which arms are worth spending seeds on. Note
# test_size=1000 scenes gives 30,000 eval questions (~3,300 per subtype),
# roughly 5x the old 200-scene split, so sigma should now be smaller than
# the 0.022 measured before -- re-estimate it from these runs before
# choosing the seed count for the focused pass.

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.q_conditioning: token,broadcast_cat,film
      model.patch_size: 5,15
      train.seed: 0