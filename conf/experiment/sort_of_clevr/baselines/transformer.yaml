# @package _global_
# Matched-capacity attention comparison at patch 5 (225 tokens).
# Patch 15 collapses ternary from 0.867 to 0.573, so it measures a
# regime in which nothing can do the task.

defaults:
  - override /model: sort_of_clevr/transformer

model:
  patch_size: 5
  patch_emb_dim: 96
  hidden_dim: 128
  n_layers: 4
  dropout: 0.1

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.0
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.q_conditioning: film,broadcast_cat
      train.seed: 0,1,2
