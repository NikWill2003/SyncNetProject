# @package _global_

defaults:
  - override /model: sort_of_clevr/transformer

model:
  # patch_size pinned. At 75px, patch 5 gives 15x15 = 225 tokens and
  # patch 15 gives 5x5 = 25 -- a 3.9x difference in cost per step
  # (measured), with no divisor in between since 75 = 3 x 5 x 5. Leaving
  # it free here would make a capacity sweep partly a resolution sweep,
  # and 4x slower than the rest of the pass. Resolution is swept as its
  # own axis in transformer_conditioning.
  patch_size: 15   # 5x5=25 tokens; patch 5 gives 225 and is 3.9x slower
  patch_emb_dim: 96
  q_conditioning: broadcast_cat
  ffn_mult: 4
  dropout: 0.0
  pos_enc: learnt_2d
  share_layer_weights: false

train:
  # Matched to the SQOOP broad pass: bs 256 x 100k steps over
  # 36,000 x 3 x 10 = 1,080,000 examples = 23.7 epochs, the same figure
  # SQOOP runs at. READ train_loss/cross_entropy BEFORE ACCURACY.
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

# 1 seed, matching the SQOOP broad pass. At sigma=0.022 that ranks
# nothing; it screens which arms are worth spending seeds on. Note
# test_size=1000 scenes gives 30,000 eval questions (~3,300 per subtype),
# roughly 5x the old 200-scene split, so sigma should now be smaller than
# the 0.022 measured before -- re-estimate it from these runs before
# choosing the seed count for the focused pass.

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.hidden_dim: 128,256
      model.n_layers: 2,4,6
      model.n_heads: 4
      train.seed: 0