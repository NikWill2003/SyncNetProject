# @package _global_
# Parameter-matched comparison against the transformer, and the
# starvation hypothesis: a narrow module cannot encode the whole scene,
# so specialisation becomes the only route to low loss. partition stays
# 'none' because quadrant asserts n_modules == 4.
defaults:
  - override /model: sort_of_clevr/syncnet

model:
  q_conditioning: film        # <- winner of conditioning.yaml
  partition: none
  gate_mode: phase
  readout_mode: sum
  T: 6

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.module_dim: 32,128
      model.n_modules: 2,4,8
      train.seed: 0,1