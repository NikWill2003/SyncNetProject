# @package _global_
# Is phase-gated communication load-bearing, and when?
#
#   partition=none      messages OPTIONAL: every module sees the whole
#                       image, so a module can answer alone
#   partition=quadrant  messages NECESSARY: one quadrant each, so
#                       cross-quadrant questions (79% of ternary) cannot
#                       be answered alone
#
#   phase   the thesis mechanism (M-1 dof, persistent)
#   attn    the "why not just attention?" steelman (O(M^2) dof)
#   mlp     learned but non-dynamical
#   open    g == 1, dense
#   frozen  random fixed gates -- the null every arm must beat
#
# readout_mode=sum removes the concat head's covert cross-module
# integration channel, so messages are the ONLY integration site.
defaults:
  - override /model: sort_of_clevr/syncnet

model:
  q_conditioning: film        # <- set to the winner of conditioning.yaml
  readout_mode: sum
  use_prior_head: true
  n_modules: 4                # quadrant requires exactly 4
  module_dim: 128
  T: 6

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.partition: none,quadrant
      model.gate_mode: phase,attn,mlp,open,frozen
      train.seed: 0,1