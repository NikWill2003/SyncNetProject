# @package _global_
# GATE NULL, 5 SEEDS -- 25 runs, ~5.3 h.
#
# The clearest result in the project so far, currently resting on ONE seed
# per arm: at partition=quadrant every gate_mode landed within 0.014
# ternary of every other -- attn 0.638, phase 0.627, frozen 0.625, mlp
# 0.624, open 0.624 -- while the partition itself was worth +0.082 over
# the 0.545 floor. `frozen` and `open` have no learned gating at all.
#
# At sigma=0.022 one seed cannot separate 0.627 from 0.625, so as it
# stands this is a screen, not a finding. Five seeds gives ~0.010
# resolution on each arm, which is enough to state the null properly:
# the forced modular partition does the work and the gating mechanism
# does none.
#
# patch 5 throughout (15x15 = 225 tokens). patch 15 collapses the
# transformer from ternary 0.867 to 0.573, so the coarse setting measures
# a regime where nothing can do the task.
defaults:
  - override /model: sort_of_clevr/syncnet

model:
  q_conditioning: film
  partition: quadrant
  readout_mode: sum
  n_modules: 4
  module_dim: 128
  T: 6
  encoder:
    patch_size: 5

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.gate_mode: phase,attn,mlp,open,frozen
      train.seed: 0,1,2,3,4
