# @package _global_
# SYNCNET MODULE-COUNT LADDER -- 9 runs, ~2.9 h.
#
# The half of capacity that quadrant forbids. partition=none frees
# n_modules but gives up the partition's +0.082 ternary, so read this as
# "does module count help at all", not as a competitive number.
#
# It is also the control for the coalition story: if accuracy tracks
# total parameters rather than module structure, the syncnet is a
# funny-shaped MLP and the modularity framing does no work.
defaults:
  - override /model: sort_of_clevr/syncnet

model:
  q_conditioning: film
  gate_mode: phase
  readout_mode: sum
  partition: none
  module_dim: 128
  T: 6
  encoder:
    patch_size: 5

train:
  n_steps: 100_000
  train_bs: 256
  val_bs: 1024
  early_stop_patience: 1_000_000
  mixed_precision: bf16
  loader_mode: gpu_cached
  grad_clip: 1.0

optim:
  lr: 3e-4
  weight_decay: 0.01
  lr_scheduler: warmup_cosine
  lr_scheduler_params:
    warmup_steps: 2_000

logging:
  eval_log_interval: 500
  train_log_interval: 500
  save_best: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.n_modules: 4,8,16
      train.seed: 0,1,2
