# @package _global_
# OBJECTS 1/2 -- 5 runs. NO PATCHIFY: the six objects are read off the
# pixels (colour, x, y, shape) and module k may read object k only, so
# every relation must pass through a message. This is the coalitions
# setting on a real task: "closest shape to red" needs a star from red
# (frustrated on S^1), "count in box" needs everyone to hear red and blue.
# Gates: phase (thesis), phase_io (directed, can realise a star), attn,
# open (mean of everyone = interference), zero (must fail relational).
# Then the sharpened gate and d=4 for the phase gate.
# READ: eval_model/obj_found must be 6.0. Then gate_entropy and
# gate_tvar: a star or a schedule shows up as low entropy / high tvar.
defaults:
  - /experiment/sort_of_clevr/sync_a/_base
  - _self_

model:
  encoder: {name: objects, ch: 128, obj_size: 5}
  partition: object
  n_modules: 6
  n_read_heads: 1
  read_proj: false

hydra:
  sweeper:
    params:
      model.gate_mode: phase,phase_io,attn,open,zero
