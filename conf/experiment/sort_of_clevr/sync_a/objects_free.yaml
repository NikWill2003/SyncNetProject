# @package _global_
# OBJECTS 2/2 -- 2 runs. Objects encoder without the partition: six
# modules compete for six objects (read_norm=modules, module_embed). Do
# they take one each (read_overlap -> 0)? Compare with objects_partition
# where the assignment is imposed.
defaults:
  - /experiment/sort_of_clevr/sync_a/_base
  - _self_

model:
  encoder: {name: objects, ch: 128, obj_size: 5}
  partition: none
  n_modules: 6
  n_read_heads: 1
  read_proj: false
  use_module_embed: true
  read_norm: modules

hydra:
  sweeper:
    params:
      model.gate_mode: phase,open
