# @package _global_
# OBJECTS dynamics 3/4 -- 2 runs. Hebbian (signed, similarity) coupling
# on object tokens, with and without the AKOrN stimulus drive.
defaults:
  - /experiment/sort_of_clevr/sync_a/_base
  - _self_
model:
  encoder: {name: objects, ch: 128, obj_size: 5}
  partition: object
  n_modules: 6
  n_read_heads: 1
  read_proj: false
  coupling: hebbian

hydra:
  sweeper:
    params:
      model.drive: none,stimulus
