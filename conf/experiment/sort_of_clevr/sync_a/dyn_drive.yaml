# @package _global_
# DYNAMICS 5/6 -- 2 runs. An input term in eq. phi, which the thesis
# model lacks: stimulus = AKOrN's conditional stimulus (c_i = W h_i pulls
# theta_i toward angle(c_i)); rotate = a per-module rotation predicted
# from h_i (the coalitions 'mlp' update). Both make the phase directly
# content-dependent rather than only through the coupling.
defaults:
  - /experiment/sort_of_clevr/sync_a/_base
  - _self_

hydra:
  sweeper:
    params:
      model.drive: stimulus,rotate
