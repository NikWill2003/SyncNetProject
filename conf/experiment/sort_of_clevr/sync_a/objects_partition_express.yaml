# @package _global_
# OBJECTS 1b/2 -- 3 runs. Object partition, phase gate that can close
# (sharpened) x oscillator dimension. The star from the queried object is
# frustrated on S^1 (rho > 0) and realisable at d=4.
defaults:
  - /experiment/sort_of_clevr/sync_a/_base
  - _self_
model:
  encoder: {name: objects, ch: 128, obj_size: 5}
  partition: object
  n_modules: 6
  n_read_heads: 1
  read_proj: false
  gate_sharpen: true

hydra:
  sweeper:
    params:
      model.osc_dim: 2,4,8
