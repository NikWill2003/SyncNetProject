# @package _global_
# PHASEBIND on OBJECTS 3 -- 4 runs. Object tokens, free assignment:
# token-token coupling {none, global} x module<->token coupling {on, off}.
# (global, on) repeats pb_objects' none/phase cell.
defaults:
  - /experiment/sort_of_clevr/sync_b/_base
  - override /model: sort_of_clevr/phasebind
  - _self_
model:
  encoder: {name: objects, ch: 128, obj_size: 5}
  tok_coupling: global
  n_modules: 6

hydra:
  sweeper:
    params:
      model.tok_coupling: none,global
      model.mod_tok_coupling: true,false
