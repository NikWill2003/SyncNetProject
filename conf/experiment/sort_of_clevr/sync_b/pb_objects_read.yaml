# @package _global_
# PHASEBIND on OBJECTS 2 -- 4 runs. Object tokens, free assignment:
# content-only read vs phase read, soft vs hard assignment.
# (additive, soft) repeats pb_objects' partition=none/phase cell: a free
# seed-repeat.
defaults:
  - /experiment/sort_of_clevr/sync_b/_base
  - override /model: sort_of_clevr/phasebind
  - _self_
model:
  encoder: {name: objects, ch: 128, obj_size: 5}
  tok_coupling: global
  n_modules: 6

hydra:
  sweeper:
    params:
      model.phase_read: none,additive
      model.hard_assign: false,true
