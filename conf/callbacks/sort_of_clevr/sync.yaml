# Analysis bundle for the synchrony screens.
#   accuracy        overall, per family, per subtype -- every eval
#   interventions   test-time gate swap / phase freeze on the best
#                   weights, plus a heatmap figure
#   t_variance      test-time T sweep + figure
#
# interventions and t_variance need 'sync' in the model's
# `supported_callbacks`; on any other model this bundle raises at build.
- name: accuracy
- name: interventions
- name: t_variance
  t_values: [0, 1, 2, 4, 6, 8, 12, 16]
  n_repeats: 3
  max_batches: 8
