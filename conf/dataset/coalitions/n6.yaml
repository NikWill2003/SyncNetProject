defaults:
  - coalitions_base
  - _self_

# N=6 catalogue: gives a graded rho ladder (stars K1,3..K1,5 and K2,3/K3,3).
#
# THE CACHE KEY. Every field in this file that changes a single byte of the
# generated .npz is interpolated into it.
#
# It replaces `dir: coalitions_${dataset.family}`, which encoded ONLY the
# family -- so changing n_modules, K, train_size, T_train, T_test,
# stream_mode, command_mode, readout_mode or the episode schedule left the
# path unchanged, build_dataloaders found a cache hit, and the run trained
# on the wrong data. It did not crash; it produced a number.
#
# `join:` is a resolver registered in src/core/registry.py: it renders a
# list as 1-2-3 instead of '[1, 2, 3]', which is not a directory name.
#
# COPY THIS LINE VERBATIM INTO EVERY NEW COALITIONS DATASET CONFIG, and if
# you ever add a data field, add it to the template in EVERY yaml at the
# same time. CoalitionsDataConfig.dir is MISSING, so a config that forgets
# `dir` fails loudly at composition rather than silently reusing a path.
dir: coalitions-n${dataset.n_modules}-K${dataset.K}-${dataset.family}-seed${dataset.seed}-tr${dataset.train_size}-te${dataset.test_size}-T${dataset.T_train}to${dataset.T_test}-ep${dataset.episodes_min}to${dataset.episodes_max}-w${dataset.window_min}to${dataset.window_max}-post${dataset.post_steps}-${dataset.stream_mode}-cmd${dataset.command_mode}-ro${dataset.readout_mode}${dataset.readout_lag_max}-inc${join:${dataset.increments}}-rho${join:${dataset.rho_dims}}

# Copied from default.yaml and kept in step with it by hand.

n_modules: 6

train_size: 30000
test_size: 3000
T_train: 40
T_test: 40

window_min: 5
window_max: 10

rho_dims: [2, 3, 4, 6]
