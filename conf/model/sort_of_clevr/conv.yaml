defaults:
  - conv_base
  - _self_

# CNN+MLP, the control from Santoro et al. 2017: answers the
# non-relational questions, fails the relational ones. The question is an
# 18-dim binary vector, so an MLP encodes it.
name: conv

q_encoder:
  name: mlp
  hidden_dim: 128
  output_dim: 128

hidden_dim: 256

encoder:
  name: cnn
  ch: 128
  hidden: 64
