defaults:
  - sort_of_clevr_phasebind_base
  - _self_

# PhaseBind: tokens and modules are one oscillator system; the read is
# phase-gated with competition over modules; the M x M gate is the same
# phase variable (see src/models/phasebind.py).
name: sort_of_clevr_phasebind

q_conditioning: film        # film | broadcast_cat | token
q_emb_dim: 32
use_pos_emb: true
partition: none             # none | quadrant (M=4) | object (objects encoder, M=6)
encoder:
  name: cnn                 # cnn | patchify | objects
  ch: 128
  hidden: 64
  patch_size: 5
  obj_size: 5

# modules
n_modules: 6                # >= number of objects, so every object can own a module
module_dim: 128
content_dim: 32
query_hidden: 64
beta_init: 5.0
per_module_gru: true

# oscillators
osc_dim: 2
T: 6
dt: 0.5
omega_scale: 0.5
learn_omega: true
tok_omega: feature          # none | feature
tok_phase_init: random      # random | encoder
mod_phase_init: learned     # learned | random

# coupling paths (each is an ablation axis)
tok_coupling: local         # local | global | none
tok_coupling_k: 1.0
mod_tok_coupling: true
mod_tok_k: 1.0
mod_mod_coupling: hebbian   # hebbian | mlp | none
mod_mod_k: 1.0
tok_stimulus: false

# read
phase_read: additive        # additive | multiplicative | only | none
lambda_init: 2.0
learn_lambda: true
read_norm: modules          # modules | tokens | both
hard_assign: false

# module-module gate
gate_mode: phase            # phase | open | zero | attn
gate_sharpen: true
gate_alpha_init: 4.0
gate_bias_init: -1.0
learn_sharpen: true
gate_zero_diag: true
k_hidden: 64
msg_dim: 64
msg_agg: mean               # mean | budget | bus

# readout
readout_mode: sum           # sum | concat
hidden_dim: 128
use_prior_head: true
vote_sees_q: true
