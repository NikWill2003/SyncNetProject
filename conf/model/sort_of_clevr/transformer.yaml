defaults:
  - transformer_base
  - _self_

name: transformer

q_encoder:
  name: identity

# patch encoder only:

hidden_dim: 128
n_heads: 4
n_layers: 2
ffn_mult: 2
dropout: 0.0

# positional encoding
pos_enc: learnt_2d # learnt_1d | learnt_2d

# where the question enters
q_conditioning: token # token | broadcast_cat | film

share_layer_weights: false # false -> normal transformer, true -> looped

encoder:
  name: field           # shared stem (the SyncNet field trunk); patchify kept as an ablation
