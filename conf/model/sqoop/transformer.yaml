defaults:
  - sqoop_transformer_base
  - _self_

name: sqoop_transformer
emb_dim: 32

# patch_emb_dim must stay < hidden_dim for broadcast_cat
patch_emb_dim: 96
patch_size: 8

hidden_dim: 128
n_heads: 4
n_layers: 4
ffn_mult: 4
dropout: 0.0

pos_enc: learnt_2d

# film | broadcast_cat | token | token_seq
q_conditioning: broadcast_cat

share_layer_weights: false
