defaults:
  - sqoop_syncnet_base
  - _self_

# the shared VQASyncNet with a token-embedding question encoder: the
# [x, rel, y] triple is embedded and flattened into the question vector
name: sqoop_syncnet
emb_dim: 32                 # SQOOP token embedding (q vector = 3 * emb_dim)

q_conditioning: film        # film | broadcast_cat | token
q_emb_dim: 32               # broadcast_cat projection width (not emb_dim)
partition: none             # none | quadrant (M=4) | views (M=3)
use_pos_emb: true

n_modules: 4
module_dim: 128
content_dim: 8
query_hidden: 64
beta_init: 5.0
learn_beta: true
use_module_embed: false
embed_scale: 1.0

gate_mode: phase            # phase | attn | mlp | open | frozen
T: 6
dt: 0.1
omega_init: 0.5
learn_omega: true
k_hidden: 64
deterministic_phase: false

msg_dim: 64
msg_agg: mean               # mean | bus

readout_mode: concat        # concat | sync | both | sum
hidden_dim: 128
use_prior_head: true
vote_sees_q: true

# img_size 64 with patch_size 8 -> 8x8 = 64 tokens
encoder:
  name: patchify
  ch: 128
  patch_size: 8
