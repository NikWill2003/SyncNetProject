defaults:
  - relnet_base
  - _self_

# Relation Network (Santoro et al. 2017); Bahdanau et al. 2019 report it
# on SQOOP. Conditioning is intrinsic -- the question enters each pair
# inside g_theta -- so this model has no q_conditioning axis.
name: relnet

q_encoder:
  name: lstm
  embedding_dim: 32
  output_dim: 128
g_hidden_dim: 256
f_hidden_dim: 256

# objects are feature-map cells, so cost goes as pair_spatial^4:
# 5 -> 25 objects, 625 pairs. 8 -> 64 objects, 4096 pairs.
pair_spatial: 5


encoder:
  name: cnn
  ch: 128
  hidden: 64
