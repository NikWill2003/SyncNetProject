# @package _global_
defaults:
  - /dataset: coalitions/default
  - /model: coalitions/phase
  - /callbacks: coalitions/default
  - _self_

train:
  n_steps: 4000
  train_bs: 256
  val_bs: 1024

  early_stop_metric: accuracy
  early_stop_big_is_better: true
  early_stop_patience: 10
  early_stop_min_delta: 0.0

  loader_mode: gpu_cached
  mixed_precision: 'no'
  compile_model: false
  grad_accum: 1
  grad_clip: 1.0
  num_workers: 0

optim:
  optimiser: adamw
  lr: 3e-4
  weight_decay: 0.0
  lr_scheduler: cosine_annealing
  lr_scheduler_params: {}

logging:
  eval_log_interval: 200
  train_log_interval: 200
  info_metrics: [loss, accuracy, acc_joint, gate_auc, offpair_leak]
  save_best: false

wandb:
  enabled: true
  project_name: coalitions
  entity: niks_priv
  group: null
  run_name: null
  tags: []
